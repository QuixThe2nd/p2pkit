name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    # Node 18 predates unflagged globalThis.crypto; the tests exercise the
    # webcrypto-based signers, so enable the flag there (no-op semantics on 20+).
    env:
      NODE_OPTIONS: ${{ matrix.node == 18 && '--experimental-global-webcrypto' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  bootstrapping-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bootstrapping-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile for this sub-package; a fresh install resolves `ws` + the
      # TypeScript/esbuild toolchain. Tests exercise the built dist/server.js.
      - run: npm install
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: node test/mm-lobby-proof.mjs

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      # Run the smoke script directly (it asserts by throwing) rather than via the
      # bun test runner, so the exact same file also runs under Deno and Node.
      - run: bun test/smoke/smoke.mjs

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The smoke test imports the built dist/, so build it with Node first — tsup
      # is a Node tool. Deno then runs the same runtime-agnostic script.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task smoke
