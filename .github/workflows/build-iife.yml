name: Build IIFE bundle

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-iife:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:iife
      - uses: actions/upload-artifact@v4
        with:
          name: p2pkit-iife-js
          path: dist/p2pkit.iife.js
          retention-days: 30
      - name: Commit rebuilt bundle back to master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # dist/ is gitignored, so force-add the built bundle.
          git add -f dist/p2pkit.iife.js
          if git diff --cached --quiet; then
            echo "IIFE bundle unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore: rebuild browser IIFE bundle [skip ci]"
          git push
